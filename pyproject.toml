[project]
name = "msi-ui-framework"
version = "0.1.0"
description = "Workspace root for the shared seismic Qt framework and the apps built on it."
requires-python = ">=3.11"
dependencies = ["seiscore", "seisqt", "demo-viewer"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
seiscore = { workspace = true }
seisqt = { workspace = true }
demo-viewer = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages/seiscore/tests", "packages/seisqt/tests", "apps/demo-viewer/tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["seiscore", "seisqt", "demo_viewer"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E402"]
